apiVersion: batch/v1
kind: Job
metadata:
  name: init-cassandra
  namespace: wikipulse
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: init-cassandra
          image: wikipulse-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: [python, -m, api.app.init_db]
          envFrom:
            - configMapRef:
                name: wikipulse-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
